server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Static assets with light caching for css/js.
    location ~* \.(css|js|svg|ico|png|jpg|woff2?)$ {
        expires 1h;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Proxy API calls to the backend service (Docker network name: "backend").
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Mouse-tracking payloads can be a few MB.
        client_max_body_size 8m;
    }

    # SPA-style fallback for everything else.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
