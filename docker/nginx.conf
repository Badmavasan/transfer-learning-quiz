server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Static assets with light caching for css/js.
    location ~* \.(css|js|svg|ico|png|jpg|woff2?)$ {
        expires 1h;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Docker's embedded DNS. Resolving the upstream per request (through a
    # variable) instead of once at startup means nginx still boots when the
    # backend is down or restarting. It answers 502 rather than refusing to
    # start with "host not found in upstream".
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Proxy API calls to the backend service (Docker network name: "backend").
    location /api/ {
        set $backend_upstream http://backend:3000;
        proxy_pass $backend_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Mouse-tracking payloads can be a few MB.
        client_max_body_size 8m;
    }

    # Extensionless routes map to their .html file ("/teacher" -> teacher.html),
    # which the Node server does itself but nginx has to be told about.
    # Anything else falls back to the student app.
    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }
}
